[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "unifi-network-client"
version = "0.1.0"
description = "Config-driven client and CLI for the UniFi Network REST API"
requires-python = ">=3.7"
dependencies = []

[project.scripts]
unifi = "unifi_api.cli:main"

[tool.setuptools.packages.find]
include = ["unifi_api*"]
